[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gyrotron-shot-log"
version = "0.1.0"
description = "Gyrotron run parameter record system using Flask-Admin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Admin>=2.2,<3",
    "SQLAlchemy>=2.0,<3",
    "WTForms>=3.1,<4",
    "gunicorn>=23,<26",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gyrotron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
