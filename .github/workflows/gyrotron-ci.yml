name: Gyrotron shot log CI
on:
  push:
    paths:
      - 'examples/gyrotron/**'
      - '.github/workflows/gyrotron-ci.yml'
  pull_request:
    paths:
      - 'examples/gyrotron/**'
      - '.github/workflows/gyrotron-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: examples/gyrotron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: examples/gyrotron/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile sources
        run: python -m compileall -q gyrotron wsgi.py tests
      - name: Run automated tests
        run: python -m pytest -q
