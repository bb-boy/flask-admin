name: Gyrotron shot log CI
on:
  push:
    paths:
      - 'examples/gyrotron/**'
      - '.github/workflows/gyrotron-ci.yml'
  pull_request:
    paths:
      - 'examples/gyrotron/**'
      - '.github/workflows/gyrotron-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: examples/gyrotron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: examples/gyrotron/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile sources
        run: python -m compileall -q gyrotron wsgi.py tests
      - name: Run automated tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React and TypeScript UI
        working-directory: examples/gyrotron/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Check Chinese interface bundle exists
        run: test -s examples/gyrotron/gyrotron/static/app/index.html

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gyrotron
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: gyrotron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gyrotron -d gyrotron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database dependencies
        working-directory: examples/gyrotron
        run: python -m pip install -e '.[dev,postgres]'
      - name: Test real PostgreSQL persistence
        working-directory: examples/gyrotron
        env:
          DATABASE_URL: postgresql+psycopg://gyrotron:ci-only-not-a-production-secret@127.0.0.1:5432/gyrotron
        run: python postgres_smoke.py
      - name: Check Docker Compose file
        env:
          DB_PASSWORD: ci-only-not-a-production-secret
          SECRET_KEY: ci-only-secret-not-for-production
        run: docker compose -f examples/gyrotron/compose.yaml config -q
      - name: Build application Docker image
        run: docker build -t gyrotron-shot-log:ci examples/gyrotron

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build modern Chinese React UI
        working-directory: examples/gyrotron/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install app and browser dependencies
        working-directory: examples/gyrotron
        run: |
          python -m pip install -e '.[dev]' playwright
          python -m playwright install --with-deps chromium
      - name: Start Flask test server
        working-directory: examples/gyrotron
        run: |
          python wsgi.py > /tmp/gyrotron-flask.log 2>&1 &
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/gyrotron-flask.log
          exit 1
      - name: Test real-browser inline parameter interaction
        working-directory: examples/gyrotron
        run: python browser_e2e.py
      - name: Test React UI with real Chromium browser
        working-directory: examples/gyrotron
        run: python browser_react_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gyrotron-browser-screenshots
          path: examples/gyrotron/artifacts/
          if-no-files-found: ignore
