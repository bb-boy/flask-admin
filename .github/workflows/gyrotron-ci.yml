name: Gyrotron shot log CI
on:
  push:
    paths:
      - 'examples/gyrotron/**'
      - '.github/workflows/gyrotron-ci.yml'
  pull_request:
    paths:
      - 'examples/gyrotron/**'
      - '.github/workflows/gyrotron-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: examples/gyrotron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: examples/gyrotron/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile sources
        run: python -m compileall -q gyrotron wsgi.py tests
      - name: Run automated tests
        run: python -m pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gyrotron
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: gyrotron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gyrotron -d gyrotron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install database dependencies
        working-directory: examples/gyrotron
        run: python -m pip install -e '.[dev,postgres]'
      - name: Test real PostgreSQL persistence
        working-directory: examples/gyrotron
        env:
          DATABASE_URL: postgresql+psycopg://gyrotron:ci-only-not-a-production-secret@127.0.0.1:5432/gyrotron
        run: python postgres_smoke.py
      - name: Check Docker Compose file
        env:
          DB_PASSWORD: ci-only-not-a-production-secret
          SECRET_KEY: ci-only-secret-not-for-production
        run: docker compose -f examples/gyrotron/compose.yaml config -q
      - name: Build application Docker image
        run: docker build -t gyrotron-shot-log:ci examples/gyrotron
